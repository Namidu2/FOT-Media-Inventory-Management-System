<div class="navbar">
    <!-- Search Box -->
    <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input
            type="text"
            placeholder="Global search..."
            [(ngModel)]="searchText"
        >
    </div>

    <!-- Right Section -->
    <div class="navbar-right">
        

        <!-- User Profile -->
        <div class="user-profile">
            <div class="avatar">
                {{ userInitials }}
            </div>
            <div class="user-info">
                <span class="user-name">{{ userName }}</span>
                <span class="user-role">{{ userRole }}</span>
            </div>
            
        </div>
    </div>
</div>
